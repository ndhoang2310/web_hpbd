<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Trang Không Tồn Tại 💖</title>
    <meta http-equiv="refresh" content="2; url=/">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #fff4f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ff477e;
            text-align: center;
            padding: 1rem;
        }
        .box {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 140, 0.2);
            border: 2px solid #ffd5e2;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { font-size: 1.1rem; color: #666; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            background: linear-gradient(135deg, #ff477e, #ff6584);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>💌 404</h1>
        <p>Đang quay trở lại trang sinh nhật của Bé Iuuu...</p>
        <a href="/">Quay lại trang chính ngay ✨</a>
